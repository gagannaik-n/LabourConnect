{% extends 'base.html' %}

{% block title %}
Create Customer Profile - LaborConnect
{% endblock %}

{% block content %}

<div class="create-profile-page">

    <div class="page-heading">
        <h2>Create Customer Profile</h2>
        <p>Add your information to complete your LaborConnect profile.</p>
    </div>

    <div class="create-profile-card">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="save-profile-button"
            >
                Save Profile
            </button>

        </form>

    </div>

    <div class="profile-back">

        <a
            href="/customer/dashboard/"
            class="back-button"
        >
            ← Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
